<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>勇者无双</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a2a1a;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;left:10px;top:10px;z-index:5;pointer-events:none;font-family:sans-serif}
  #score{position:fixed;right:12px;top:10px;z-index:5;color:#fff;font:bold 18px sans-serif;text-shadow:0 2px 4px #000;pointer-events:none}
  #levelTag{position:fixed;right:12px;top:36px;z-index:5;color:#fff;font:bold 13px sans-serif;text-shadow:0 2px 4px #000;pointer-events:none}
  #gold{position:fixed;right:12px;top:56px;z-index:5;color:#ffd24a;font:bold 18px sans-serif;text-shadow:0 2px 4px #000;pointer-events:none}
  #shopBtn{position:fixed;right:12px;top:94px;z-index:6;background:rgba(200,150,30,.92);color:#fff;border:3px solid #ffd24a;border-radius:14px;padding:7px 12px;font-weight:bold;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.4);cursor:pointer}
  #musicBtn{position:fixed;right:12px;top:140px;z-index:6;background:rgba(90,60,160,.92);color:#fff;border:3px solid #b48af2;border-radius:14px;padding:7px 12px;font-weight:bold;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.4);cursor:pointer}
  #homeBtn{position:fixed;right:12px;top:186px;z-index:6;background:rgba(40,110,160,.92);color:#fff;border:3px solid #6ab8f2;border-radius:14px;padding:7px 12px;font-weight:bold;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.4);cursor:pointer}
  #rotBtn{position:fixed;right:12px;top:232px;z-index:6;background:rgba(60,130,70,.92);color:#fff;border:3px solid #8fd05a;border-radius:14px;padding:7px 12px;font-weight:bold;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.4);cursor:pointer}
  /* 🔄 转屏：只转 #rot 外壳（沙盒世界同款方案，iPad 触控和性能都正常）；左上角经典定位+JS 给真实像素 */
  #rot{position:fixed;inset:0}
  #rot.rot90{inset:auto;top:0;transform:rotate(90deg);transform-origin:top left}
  /* 🔄 旋转后的可用高度=设备宽度（vw），卡片按 vw 限高，关闭钮不会被顶出去；技能钮缩小防重叠 */
  #rot.rot90 #shopCard, #rot.rot90 #homeCard{max-height:88vw}
  #rot.rot90 #skills{gap:5px;bottom:118px;right:112px}
  #rot.rot90 .skl{width:38px;height:38px;font-size:15px;border-width:2px}
  #home{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,14,24,.86)}
  #homeCard{background:#14202e;border:4px solid #ffd24a;border-radius:18px;padding:20px 22px;color:#fff;font-family:sans-serif;width:min(360px,88vw);max-height:86vh;display:flex;flex-direction:column}
  #homeNew{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:#7ec850;color:#14300e;font-weight:bold;font-size:16px;cursor:pointer}
  .slot{display:flex;align-items:center;gap:8px;background:#1e2c3c;border:2px solid #3a5a78;border-radius:12px;padding:9px 10px;margin-top:8px;font-size:12px}
  .slot .inf{flex:1;line-height:1.5}
  .slot button{background:#2e4a66;color:#fff;border:2px solid #6ab8f2;border-radius:10px;padding:6px 10px;font-weight:bold;cursor:pointer;white-space:nowrap}
  #shop{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,20,10,.7)}
  #shopCard{background:#3a2f14;border:4px solid #ffd24a;border-radius:18px;padding:20px 22px;color:#fff;font-family:sans-serif;width:min(340px,88vw);max-height:84vh;display:flex;flex-direction:column}
  #shopItems{overflow-y:auto;flex:1;min-height:0;padding-right:4px}
  .shopSec{font-weight:bold;font-size:15px;margin:8px 0 6px;color:#ffd24a}
  .shopIt{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px;margin-bottom:10px}
  .shopIt .ic{font-size:30px}
  .shopIt .nm{font-weight:bold;font-size:16px}
  .shopIt .ds{font-size:12px;opacity:.85;margin-top:2px}
  .shopIt button{margin-left:auto;padding:8px 12px;border:0;border-radius:10px;background:#ffd24a;color:#4a3808;font-weight:bold;cursor:pointer;white-space:nowrap}
  .shopIt button:disabled{background:#8a8a8a;color:#ddd;cursor:default}
  #shopClose{width:100%;padding:11px;border:0;border-radius:12px;background:#7ec850;color:#14300e;font-weight:bold;font-size:16px;cursor:pointer}
  .btn{position:fixed;z-index:6;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:bold;color:#fff;text-shadow:0 2px 3px #000;box-shadow:0 4px 10px rgba(0,0,0,.4)}
  #atkBtn{right:26px;bottom:36px;width:96px;height:96px;background:rgba(220,60,60,.85);border:4px solid #ff9a9a;font-size:38px}
  #autoBtn{right:38px;bottom:150px;width:72px;height:72px;background:rgba(90,90,110,.85);border:4px solid #b8b8c8;font-size:15px}
  #autoBtn.on{background:rgba(60,180,80,.9);border-color:#9af2a8}
  #skills{position:fixed;right:118px;bottom:150px;z-index:6;display:none;flex-direction:column-reverse;gap:8px}
  #skills.touch{display:flex}
  .skl{width:48px;height:48px;border-radius:50%;background:rgba(70,40,120,.9);border:3px solid #b48af2;font-size:20px;cursor:pointer;position:relative;padding:0;display:flex;align-items:center;justify-content:center}
  .skl .cd{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:15px;font-weight:bold;display:none;align-items:center;justify-content:center;font-family:sans-serif}
  .skl.oncd .cd{display:flex}
  #joy{left:36px;bottom:46px;width:120px;height:120px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35)}
  #joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.55)}
  #over{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,20,10,.82);flex-direction:column;font-family:sans-serif}
  #overCard{background:#2a4a2a;border:4px solid #7ec850;border-radius:18px;padding:26px 34px;text-align:center;color:#fff}
  #again{margin-top:14px;padding:12px 28px;font-size:20px;font-weight:bold;border:0;border-radius:12px;background:#7ec850;color:#14300e;cursor:pointer}
  #tip{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:5;color:rgba(255,255,255,.75);font:13px sans-serif;pointer-events:none;text-shadow:0 1px 3px #000}

<div id="hud"></div>
<div id="score">⚔️ 击败 0</div>

<div id="gold">💰 0</div>

<button id="musicBtn">🎵 音乐</button>
<button id="homeBtn">🏠 主页</button>
<button id="rotBtn">🔄 转屏</button>
<div id="home"><div id="homeCard">
  <div style="font-size:34px;font-weight:bold;text-align:center">🗡️ 勇者无双</div>

  <button id="homeNew">🆕 新的冒险（从第一关开始）</button>
</div></div>
<div id="shop"><div id="shopCard">

  <div id="shopItems"></div>
  <button id="shopClose" style="margin-top:10px">继续战斗 ⚔️</button>
</div></div>
<div id="joy" class="btn"><div id="joyKnob"></div></div>
<button id="atkBtn" class="btn">⚔️</button>
<button id="autoBtn" class="btn">自动<br>攻击</button>
<div id="skills"></div>
<div id="tip">WASD/方向键走动，空格攻击；触屏用摇杆+⚔️</div>
<div id="over"><div id="overCard">
  <div style="font-size:30px;font-weight:bold">😵 你被怪物围住了！</div>
  <div id="overScore" style="margin-top:10px;font-size:18px"></div>
  <button id="again">🔄 再来一局</button>
  <button id="overHome" style="margin-top:10px">🏠 回主页</button>
</div></div>
</div>

  banner.t = Math.max(0, banner.t - dt); shakeT = Math.max(0, shakeT - dt);

    /* 🗡️ 光影剑残影中：不能移动、全程无敌、0.5 秒到点闪回原点 */
    if (player.tpT > 0) {
      player.tpT -= dt; player.inv = Math.max(player.inv, player.tpT + 0.02);
      if (player.tpT <= 0) {
        player.x = player.tpRx; player.y = player.tpRy;
        burst(player.x, player.y, '#8fd8ff', 14); beep(1200, 700, 0.12, 'sine', 0.1);
      }
    } else if (!(player.frozenT > 0)) {   // ❄️ 冻住时不能动
      let mx = joyVec.x, my = joyVec.y;
      if (keys['a'] || keys['arrowleft']) mx -= 1; if (keys['d'] || keys['arrowright']) mx += 1;
      if (keys['w'] || keys['arrowup']) my -= 1; if (keys['s'] || keys['arrowdown']) my += 1;
      if (rotated) { const t = mx; mx = my; my = -t; }   // 🔄 转屏后输入方向跟着转 90°
      const slow = player.drainSlow ? 0.4 : 1; player.drainSlow = false;   // ⛓️ 夺魂锁链减速
      playerStep(player, mx, my, dt, (player.speedMul || 1) * slow);   // 👟 跑鞋皇冠加速
    }
    if ((autoOn || holdAtk) && !(player.frozenT > 0)) { autoT -= dt; if (autoT <= 0) { autoT = 0.2; doAttack(true); } }   // ⚔️ 自动/按住：0.2 秒一刀
    /* ✨ 技能冷却递减 + 按钮显示 */
    if (player.skillCds) for (const k in player.skillCds) player.skillCds[k] = Math.max(0, player.skillCds[k] - dt);
    for (const r of skillRefs) {
      const c = (player.skillCds && player.skillCds[r.k]) || 0;
      r.btn.classList.toggle('oncd', c > 0);
      const t = c > 0 ? String(Math.ceil(c)) : '';
      if (r.cd.textContent !== t) r.cd.textContent = t;
    }
    /* ✨ 技能弹道（大火球等） */
    for (const s of skillShots) {
      s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (Math.random() < 0.5) burst(s.x, s.y, s.color, 1);
      for (const z of zombies) {
        if (z.dead) continue;
        if (Math.hypot(z.x - s.x, z.y - s.y) < z.r + 10) {
          hurtZ(z, s.dmg, s.color);
          if (s.burn) { z.burnT = 2; z.burnAcc = 0; }
          if (s.freeze) z.freezeT = s.freeze;
          if (s.zapx) z.hp -= 2;
          s.t = 0; break;
        }
      }
    }
    skillShots = skillShots.filter(s => s.t > 0);
    /* ☁️ 毒雾：里面的怪每 0.1 秒掉十分之一血 */
    for (const c of clouds) {
      c.t -= dt; c.acc += dt;
      if (c.acc >= 0.1) { c.acc -= 0.1; for (const z of zombies.slice()) if (!z.dead && Math.hypot(z.x - c.x, z.y - c.y) < c.r) hurtZ(z, dotDmg(z), c.color); }
    }

    fxLines = fxLines.filter(f => f.t > 0);

        if (touchHurt(player, z, dmgT)) {

          if (player.hearts <= 0 && !angelSave()) { gameOver = true; document.getElementById('overScore').textContent = `你这局打败了 ${kills} 只怪物！`; document.getElementById('over').style.display = 'flex'; saveGame(); }

        beep(dmgRoll === 0 ? 700 : dmgRoll === 0.5 ? 500 : 140, dmgRoll === 0 ? 900 : dmgRoll === 0.5 ? 300 : 60, dmgRoll === 1 ? 0.25 : 0.1, 'sawtooth', 0.16);

        ga.t = 0;
        const dmg = rollDmg(1);
        if (dmg > 0) {
          player.hearts -= dmg; player.inv = 0.8; player.sinceHurt = 0; shakeT = Math.max(shakeT, 0.2);
          burst(player.x, player.y, '#e84a4a', 14); beep(150, 60, 0.3, 'sawtooth', 0.2);

        } else { burst(player.x, player.y, '#e8f4ff', 8); }

          if (z.hp <= 0) killZombie(z);

function loop(now) {

    if (player.weapon && WEAPON_CANVAS[player.weapon]) {
      const wa = player.atkT > 0 ? player.dir - 0.9 + (1 - player.atkT / ATTACK.swing) * 1.8 : player.dir + 0.55;
      const wx = player.x + Math.cos(wa) * 16, wy = player.y - 4 + Math.sin(wa) * 16;
      ctx.save(); ctx.translate(wx, wy); ctx.rotate(wa + Math.PI / 2);
      ctx.drawImage(WEAPON_CANVAS[player.weapon], -8, -18);
      ctx.restore();
    }
    /* 🛡️ 穿在身上的盔甲看得见：胸甲/帽子/皇冠 */
    const bobA = bob;
    if (player.owned.gold_armor || player.armor) {   // 胸甲
      ctx.fillStyle = player.owned.gold_armor ? 'rgba(255,210,74,.75)' : 'rgba(170,180,192,.75)';
      ctx.fillRect(player.x - 8, player.y - 4 - bobA, 16, 9);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(player.x - 8, player.y + 3 - bobA, 16, 2);
      ctx.fillRect(player.x - 5, player.y - 2 - bobA, 2, 2); ctx.fillRect(player.x + 3, player.y - 2 - bobA, 2, 2);
    }
    if (player.owned.crown) {   // 👑 皇冠
      ctx.fillStyle = '#ffd24a'; ctx.fillRect(player.x - 8, player.y - 16 - bobA, 16, 4);
      ctx.fillRect(player.x - 8, player.y - 19 - bobA, 3, 3); ctx.fillRect(player.x - 1.5, player.y - 20 - bobA, 3, 4); ctx.fillRect(player.x + 5, player.y - 19 - bobA, 3, 3);
    } else if (player.owned.hat) {   // 🎩 皮帽子
      ctx.fillStyle = '#8a5a2a'; ctx.fillRect(player.x - 9, player.y - 15 - bobA, 18, 4);
      ctx.fillRect(player.x - 6, player.y - 19 - bobA, 12, 4);
    }
    if (player.critT > 0) { ctx.fillStyle = '#ffe84a'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('暴击!', player.x - 16, player.y - 24); }
    if (player.frozenT > 0) {   // ❄️ 被骷髅王冻住：蓝色冰壳
      ctx.fillStyle = 'rgba(140,210,255,.5)'; ctx.fillRect(player.x - 14, player.y - 20, 28, 36);
      ctx.fillStyle = '#c8f4ff'; ctx.font = '12px sans-serif'; ctx.fillText('❄️', player.x - 6, player.y - 26);
    }
    /* ❤️ 血条在玩家脑袋上，跟着玩家动（半心也能画） */
    const maxH = player.maxHearts || PLAYER.hearts, hw = 13, hx0 = player.x - maxH * hw / 2;
    ctx.font = '12px sans-serif';
    for (let i = 0; i < maxH; i++) {
      const hx = hx0 + i * hw, hy = player.y - 30;
      if (player.hearts >= i + 1) { ctx.globalAlpha = 1; ctx.fillText('❤️', hx, hy); }
      else if (player.hearts >= i + 0.5) { ctx.globalAlpha = 0.25; ctx.fillText('❤️', hx, hy);
        ctx.globalAlpha = 1; ctx.save(); ctx.beginPath(); ctx.rect(hx, hy - 14, 7, 16); ctx.clip(); ctx.fillText('❤️', hx, hy); ctx.restore(); }
      else { ctx.globalAlpha = 0.25; ctx.fillText('❤️', hx, hy); }
    }
    ctx.globalAlpha = 1;
  }
  // 粒子
  for (const pt of parts) { ctx.globalAlpha = Math.min(1, pt.t * 2); ctx.fillStyle = pt.c; ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  if (slamFx) {   // 💥 砸地冲击波：黄土环炸开
    const p = 1 - slamFx.t / 0.4;
    ctx.globalAlpha = 1 - p; ctx.strokeStyle = '#c8a86a'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(slamFx.x, slamFx.y, 20 + p * BOSS.slamR, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 血心已搬到玩家头顶（跟着玩家动，不挡 BOSS 血条）
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = '22px sans-serif';
  // 装备栏小图标（武器+已买装备，最多摆 10 个）
  const TBLH = shopNow();
  let ei = 0;
  if (player.weapon && TBLH[player.weapon]) { ctx.globalAlpha = 1; ctx.fillText(TBLH[player.weapon].icon, 10 + ei * 26, 58); ei++; }
  for (const k in player.owned) { if (TBLH[k] && TBLH[k].kind === 'gear' && ei < 10) { ctx.globalAlpha = 1; ctx.fillText(TBLH[k].icon, 10 + ei * 26, 58); ei++; } }
  ctx.globalAlpha = 1;
  // 👹 BOSS 血条（顶部居中大红条）
  const bb = zombies.find(z => z.boss && !z.dead);
  if (bb) {
    const bw = Math.min(420, VW * 0.62);
    ctx.fillStyle = '#0009'; ctx.fillRect(VW / 2 - bw / 2 - 3, 12, bw + 6, 22);
    ctx.fillStyle = '#7a1a1a'; ctx.fillRect(VW / 2 - bw / 2, 15, bw, 16);
    ctx.fillStyle = '#e84a4a'; ctx.fillRect(VW / 2 - bw / 2, 15, bw * Math.max(0, bb.hp / (bb.maxHp || BOSS.hp)), 16);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('👹 BOSS ' + Math.max(0, Math.ceil(bb.hp)) + ' / ' + (bb.maxHp || BOSS.hp), VW / 2, 28); ctx.textAlign = 'left';
  }
  // 📣 横幅（BOSS 出场/击杀播报）
  if (banner.t > 0) {
    ctx.globalAlpha = Math.min(1, banner.t); ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeText(banner.txt, VW / 2, VH * 0.24);
    ctx.fillText(banner.txt, VW / 2, VH * 0.24);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}
/* 测试挂钩（别删，E2E 要用） */
window.G = { get player() { return player; }, get zombies() { return zombies; }, get kills() { return kills; }, get gameOver() { return gameOver; }, get paused() { return paused; }, get autoOn() { return autoOn; }, get holdAtk() { return holdAtk; }, get level() { return level; }, get earrows() { return earrows; }, get parrows() { return parrows; }, get garrows() { return garrows; }, get meteors() { return meteors; }, get puddles() { return puddles; }, doAttack, reset, keys, update, toggleShop, buyFromShop, spawnBoss, spawnEnemy,
  setKills: v => { kills = v; updateScore(); }, setLevel: v => { level = v; updateScore(); renderSkills(); }, setAuto: v => { autoOn = v; autoBtn.classList.toggle('on', v); if (v) autoT = 0; }, setHold: v => { holdAtk = v; if (v) autoT = 0; },
  get skillShots() { return skillShots; }, get clouds() { return clouds; }, get fxLines() { return fxLines; }, get netOrbs() { return netOrbs; }, get shocks() { return shocks; },
  castSkill, renderSkills, ownedSkills, spawnStorm: () => { const z = makeStorm(player.x + 150, player.y, Math.random); zombies.push(z); }, spawnVoid: () => { const z = makeVoid(player.x + 150, player.y, Math.random); zombies.push(z); } };
reset(); if (loadGame()) setBanner('💾 存档已读取，接着玩！');
showHome();   // 🏠 开机先进主页选存档
addEventListener('pointerdown', startMusic, { once: true });   // 🎵 第一次点屏幕时开播（浏览器规矩）
addEventListener('keydown', startMusic, { once: true });
requestAnimationFrame(loop);
</script>
